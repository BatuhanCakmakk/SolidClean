[rules.user-temp]
name = "临时文件"
about = "程序在安装或运行时留下的残余文件。"
effect = "没有影响。最近 7 天内使用过的文件和正在打开的文件会被跳过。"

[rules.windows-temp]
name = "Windows 临时文件"
about = "Windows 及其服务使用的系统级临时文件夹。"
effect = "没有影响。最近 7 天内使用过的文件和正在打开的文件会被跳过。"

[rules.update-cache]
name = "Windows 更新下载"
about = "已安装更新的安装文件。"
effect = "没有影响。有更新等待重启时会跳过；下次更新时 Windows 会重新下载所需内容。"

[rules.delivery-optimization]
name = "传递优化缓存"
about = "Windows 为与网络中其他电脑共享更新而保留的副本。"
effect = "没有影响。"

[rules.error-reports]
name = "崩溃转储和错误报告"
about = "程序崩溃时生成的内存转储，以及已发送的错误报告。"
effect = "没有影响，除非你打算把崩溃报告发给开发者。"

[rules.system-error-reports]
name = "系统错误报告"
about = "Windows 和程序的系统级错误报告，已发送或在队列中等待。"
effect = "没有影响。"

[rules.minidumps]
name = "蓝屏小型转储"
about = "每次蓝屏时保存的小型转储，用于查找原因。"
effect = "如果最近 30 天内出现过蓝屏并且正在排查，请保留；否则没有影响。"

[rules.memory-dump]
name = "完整内存转储"
about = "上次蓝屏时的完整内存快照，通常非常大。"
effect = "如果最近 30 天内出现过蓝屏并且正在排查，请保留；否则没有影响。"

[rules.browser-chrome]
name = "Chrome 缓存"
about = "你访问过的网站的图片、脚本和文件副本。"
effect = "网站首次加载可能稍慢。密码、历史记录和登录状态都会保留。"

[rules.browser-edge]
name = "Edge 缓存"
