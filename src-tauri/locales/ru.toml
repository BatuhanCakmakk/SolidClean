# Русский

[messages]
close_apps = "Сначала закройте"
command_failed = "Команда Windows завершилась ошибкой"
nothing_removed = "Ничего не удалось удалить; возможно, всё используется."
in_use = "Пропущено используемых элементов: {count}"
restart_pending = "Обновление ожидает перезагрузки. Сначала перезагрузите компьютер, иначе этот шаг будет пропущен."
all_drives = "Все диски"
elevation_declined = "Права администратора не предоставлены, шаг пропущен."
elevation_failed = "Не удалось выполнить шаг администратора: {error}"

[rules.user-temp]
name = "Временные файлы"
about = "Остатки, которые программы оставляют при установке или работе."
effect = "Никаких последствий. Файлы, использованные за последние 7 дней, и открытые файлы пропускаются."

[rules.windows-temp]
name = "Временные файлы Windows"
about = "Общая временная папка Windows и её служб."
effect = "Никаких последствий. Файлы, использованные за последние 7 дней, и открытые файлы пропускаются."

[rules.update-cache]
name = "Загрузки Центра обновления Windows"
about = "Скачанные установочные файлы уже установленных обновлений."
effect = "Никаких последствий. Пропускается, пока обновление ожидает перезагрузки; при следующем обновлении Windows скачает всё нужное заново."

[rules.delivery-optimization]
name = "Кэш оптимизации доставки"
about = "Копии, которые Windows хранит, чтобы делиться обновлениями с другими компьютерами в сети."
effect = "Никаких последствий."

[rules.error-reports]
name = "Аварийные дампы и отчёты об ошибках"
about = "Дампы памяти, созданные при сбоях программ, и уже отправленные отчёты об ошибках."
effect = "Никаких последствий, если только вы не собираетесь отправить отчёт о сбое разработчику."

[rules.system-error-reports]
name = "Системные отчёты об ошибках"
about = "Отчёты об ошибках Windows и программ, уже отправленные или ожидающие в очереди."
effect = "Никаких последствий."

[rules.minidumps]
name = "Мини-дампы синего экрана"
about = "Небольшие дампы, которые сохраняются при каждом синем экране. По ним ищут причину сбоя."
effect = "Если за последние 30 дней был синий экран и вы его расследуете, сохраните их; иначе никаких последствий."

[rules.memory-dump]
name = "Полный дамп памяти"
about = "Полный снимок памяти при последнем синем экране. Обычно очень большой."
effect = "Если за последние 30 дней был синий экран и вы его расследуете, сохраните его; иначе никаких последствий."

[rules.browser-chrome]
name = "Кэш Chrome"
about = "Копии изображений, скриптов и файлов с посещённых сайтов."
effect = "Сайты могут в первый раз загружаться чуть медленнее. Пароли, история и входы сохраняются."

[rules.browser-edge]
name = "Кэш Edge"
about = "Копии изображений, скриптов и файлов с посещённых сайтов."
effect = "Сайты могут в первый раз загружаться чуть медленнее. Пароли, история и входы сохраняются."

[rules.browser-firefox]
name = "Кэш Firefox"
about = "Копии изображений, скриптов и файлов с посещённых сайтов."
effect = "Сайты могут в первый раз загружаться чуть медленнее. Пароли, история и входы сохраняются."

[rules.browser-opera]
name = "Кэш Opera"
about = "Копии изображений, скриптов и файлов с посещённых сайтов."
effect = "Сайты могут в первый раз загружаться чуть медленнее. Пароли, история и входы сохраняются."

[rules.browser-brave]
name = "Кэш Brave"
about = "Копии изображений, скриптов и файлов с посещённых сайтов."
effect = "Сайты могут в первый раз загружаться чуть медленнее. Пароли, история и входы сохраняются."

[rules.discord-cache]
name = "Кэш Discord"
about = "Копии изображений, GIF и видео из чатов."
effect = "Медиа в старых сообщениях скачаются заново. Сообщения и учётная запись не затрагиваются."

[rules.shader-cache]
name = "Кэш графических шейдеров"
about = "Программы видеокарты, скомпилированные для игр и приложений."
effect = "При первом запуске игры могут кратко подтормаживать, затем всё проходит само."

[rules.vscode-cache]
name = "Кэш VS Code"
about = "Файлы старых версий и скачанные пакеты расширений."
effect = "Никаких последствий. Настройки и расширения остаются."

[rules.npm-cache]
name = "Кэш npm"
about = "Копии пакетов, скачанных для проектов Node.js."
effect = "Пакеты скачаются заново при следующей установке."

[rules.pip-cache]
name = "Кэш pip"
about = "Копии пакетов, скачанных для проектов Python."
effect = "Пакеты скачаются заново при следующей установке."

[rules.yarn-cache]
name = "Кэш Yarn"
about = "Копии пакетов, скачанных для проектов Node.js."
effect = "Пакеты скачаются заново при следующей установке."

[rules.nuget-cache]
name = "Кэш загрузок NuGet"
about = "Списки пакетов и плагины, скачанные для проектов .NET."
effect = "Никаких последствий."

[rules.gradle-cache]
name = "Кэши Gradle"
about = "Библиотеки и кэши сборки, скачанные для проектов Android и Java."
effect = "Следующая сборка заново скачает зависимости и займёт больше времени. Если Gradle работает в фоне, остановите его командой «gradlew --stop» в проекте."

[rules.recycle-bin]
name = "Корзина"
about = "Удалённые вами файлы, которые ещё не стёрты окончательно."
effect = "Эти файлы больше нельзя будет восстановить. Загляните в Корзину перед очисткой."

[rules.old-downloads]
name = "Старые установщики и архивы"
about = "Установщики и архивы в папке «Загрузки» старше 30 дней."
effect = "Никаких последствий, если программа уже установлена. Убедитесь, что в архивах нет ничего нужного."

[rules.hibernation]
name = "Файл гибернации"
about = "Сюда сохраняется память для гибернации и быстрого запуска."
effect = "Гибернация и быстрый запуск отключаются; загрузка может длиться на несколько секунд дольше. Чтобы вернуть: powercfg /hibernate on"

[rules.windows-old]
name = "Предыдущая установка Windows"
about = "Старая система, оставшаяся после крупного обновления Windows. Windows удаляет её через 10 дней."
effect = "Вернуться к предыдущей версии Windows будет нельзя."
manual = "Параметры > Система > Память > Временные файлы > отметьте «Предыдущие установки Windows» и удалите."

[rules.ollama-models]
name = "Модели Ollama"
about = "Модели ИИ, работающие на вашем компьютере. Каждая может занимать несколько ГБ."
effect = "Удалённая модель скачается заново, если вы снова её используете."
manual = "Выполните «ollama list» в терминале, затем удалите ненужные командой «ollama rm <модель>»."

[rules.huggingface-cache]
name = "Модели Hugging Face"
about = "Модели и наборы данных, скачанные библиотеками ИИ для Python."
effect = "Удалённые модели скачаются заново при повторном использовании."
manual = "Выполните «huggingface-cli delete-cache» в терминале и выберите, что удалить."

[rules.claude-temp]
name = "Файлы сеансов Claude"
about = "Вывод команд, вставленные изображения и рабочие файлы сеансов Claude Code. Открытые сеансы используют эти файлы."
effect = "Пока Claude открыт, очистка не выполняется. В Корзину попадают только папки сеансов, не использовавшиеся более 30 дней; если вернуться к этим сеансам, их старого вывода и изображений не будет."

[rules.claude-app-cache]
name = "Кэш приложения Claude"
about = "Кэш интерфейса и журналы настольного приложения Claude. Ваши чаты здесь не хранятся."
effect = "Пока Claude открыт, очистка не выполняется. В Корзину попадают только файлы, не использовавшиеся более 30 дней; в следующий раз приложение может загружаться чуть медленнее."

[rules.claude-code-history]
name = "История разговоров Claude Code"
about = "Записи сеансов Claude Code. Именно они позволяют вернуться к старым сеансам через «claude --resume»."
effect = "Удалённые сеансы нельзя будет продолжить."
manual = "Claude Code удаляет их сам: сеансы старше «cleanupPeriodDays» из ~/.claude/settings.json (по умолчанию 30 дней) очищаются при запуске. Не удаляйте эту папку вручную."

[rules.codex-sessions]
name = "Записи сеансов Codex"
about = "Записи чатов OpenAI Codex. Именно они позволяют вернуться к старым чатам и продолжить их."
effect = "Удалённые чаты нельзя будет продолжить."
manual = "Удаляйте ненужные чаты в самом Codex («codex delete <id потока>» в терминале). Ручное удаление файлов может повредить список чатов; архивирование место не освобождает."

[rules.gemini-history]
name = "Сохранённые чаты Gemini CLI"
about = "Сохранённые чаты и точки восстановления, которые Gemini CLI хранит для каждого проекта."
effect = "Удалённые чаты и точки восстановления вернуть нельзя."
manual = "В Gemini CLI выведите сохранённые чаты командой «/chat list» и удалите ненужные через «/chat delete <тег>»."

[rules.gemini-temp]
name = "Временные файлы Gemini"
about = "Временные файлы, которые Gemini CLI и Antigravity оставляют во время работы (например, данные подключения к редактору)."
effect = "В Корзину попадают только элементы, не использовавшиеся более 30 дней."

[rules.lmstudio-models]
name = "Модели LM Studio"
about = "Модели ИИ, работающие на вашем компьютере. Каждая может занимать несколько ГБ."
effect = "Удалённая модель скачается заново, если вы снова её используете."
manual = "Удалите неиспользуемые модели в разделе «My Models» в LM Studio."

[rules.docker-disk]
name = "Виртуальный диск Docker"
about = "Виртуальный диск с образами и контейнерами Docker. Сам он не уменьшается."
effect = "Никогда не удаляйте этот файл напрямую: все данные Docker будут потеряны."
manual = "Удалите неиспользуемые образы командой «docker system prune -a», затем уменьшите диск в Docker Desktop > Troubleshoot > «Clean / Purge data»."
