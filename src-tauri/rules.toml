name = { tr = "Claude uygulama önbelleği", en = "Claude app cache" }
about = { tr = "Claude masaüstü uygulamasının arayüz önbelleği ve günlük (log) dosyaları. Sohbetleriniz burada değil.", en = "The Claude desktop app's interface cache and log files. Your chats are not stored here." }
effect = { tr = "Claude açıkken temizlenmez. Yalnızca 30 günden uzun süredir kullanılmayan dosyalar Geri Dönüşüm Kutusu'na taşınır; uygulama bir sonraki açılışta biraz yavaş yüklenebilir.", en = "Not cleaned while Claude is open. Only files unused for more than 30 days go to the Recycle Bin; the app may load a little slower next time." }

[[rule]]
id = "claude-code-history"
safety = "review"
category = "ai"
kind = "dir"
paths = ['%USERPROFILE%\.claude\projects']
name = { tr = "Claude Code konuşma geçmişi", en = "Claude Code conversation history" }
about = { tr = "Claude Code oturumlarının kayıtları. Eski oturumlara \"claude --resume\" ile dönmek bunlarla mümkün.", en = "Records of Claude Code sessions. They are what lets you return to old sessions with \"claude --resume\"." }
effect = { tr = "Silinen oturumlara geri dönülemez.", en = "Deleted sessions can't be resumed." }
manual = { tr = "Claude Code bunları kendisi siler: ~/.claude/settings.json içindeki \"cleanupPeriodDays\" süresinden (varsayılan 30 gün) eski oturumlar açılışta temizlenir. Bu klasörü elle silmeyin.", en = "Claude Code removes these itself: sessions older than \"cleanupPeriodDays\" in ~/.claude/settings.json (30 days by default) are cleaned up at startup. Don't delete this folder by hand." }

[[rule]]
id = "codex-sessions"
safety = "review"
category = "ai"
kind = "dir"
paths = ['%USERPROFILE%\.codex\sessions', '%USERPROFILE%\.codex\archived_sessions']
name = { tr = "Codex oturum kayıtları", en = "Codex session records" }
about = { tr = "OpenAI Codex sohbetlerinin kayıtları. Eski sohbetlere dönmek ve devam etmek bunlarla mümkün.", en = "Records of OpenAI Codex chats. They are what lets you return to and continue old chats." }
effect = { tr = "Silinen sohbetlere geri dönülemez.", en = "Deleted chats can't be resumed." }
manual = { tr = "Kullanmadığınız sohbetleri Codex'in kendisinden silin (terminalde \"codex delete <sohbet kimliği>\"). Dosyaları elle silmek sohbet listesini bozabilir; arşivlemek yer açmaz.", en = "Delete chats you no longer need from Codex itself (\"codex delete <thread id>\" in a terminal). Deleting the files by hand can break the chat list; archiving does not free space." }

[[rule]]
id = "gemini-history"
safety = "review"
category = "ai"
kind = "dir"
paths = ['%USERPROFILE%\.gemini\tmp']
name = { tr = "Gemini CLI kayıtlı sohbetleri", en = "Gemini CLI saved chats" }
about = { tr = "Gemini CLI'ın proje başına tuttuğu kayıtlı sohbetler ve geri alma noktaları.", en = "Saved chats and restore points that Gemini CLI keeps for each project." }
effect = { tr = "Silinen sohbetler ve geri alma noktaları geri getirilemez.", en = "Deleted chats and restore points can't be brought back." }
manual = { tr = "Gemini CLI'da \"/chat list\" ile kayıtlı sohbetleri görün, gerekmeyenleri \"/chat delete <etiket>\" ile silin.", en = "In Gemini CLI, list saved chats with \"/chat list\" and remove the ones you don't need with \"/chat delete <tag>\"." }

[[rule]]
id = "gemini-temp"
safety = "review"
category = "ai"
kind = "contents"
paths = ['%TEMP%\gemini']
older_than_days = 30
name = { tr = "Gemini geçici dosyaları", en = "Gemini temporary files" }
about = { tr = "Gemini CLI ve Antigravity'nin çalışırken bıraktığı geçici dosyalar (ör. düzenleyici bağlantı bilgileri).", en = "Temporary files Gemini CLI and Antigravity leave while running (such as editor connection info)." }
effect = { tr = "Yalnızca 30 günden uzun süredir kullanılmayan öğeler Geri Dönüşüm Kutusu'na taşınır.", en = "Only items unused for more than 30 days go to the Recycle Bin." }

[[rule]]
id = "lmstudio-models"
safety = "review"
category = "ai"
kind = "dir"
paths = ['%USERPROFILE%\.lmstudio\models']
name = { tr = "LM Studio modelleri", en = "LM Studio models" }
about = { tr = "Bilgisayarınızda çalışan yapay zekâ modelleri. Her biri birkaç GB olabilir.", en = "AI models that run on your computer. Each can be several GB." }
effect = { tr = "Silinen model tekrar kullanılmak istenirse yeniden indirilir.", en = "A removed model is downloaded again if you use it later." }
manual = { tr = "LM Studio'da Modeller (My Models) bölümünden kullanmadığınız modelleri silin.", en = "Remove models you don't use from the My Models section in LM Studio." }

