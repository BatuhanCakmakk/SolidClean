[[rule]]
id = "docker-disk"
safety = "review"
category = "dev"
kind = "file"
paths = ['%LOCALAPPDATA%\Docker\wsl\disk\docker_data.vhdx', '%LOCALAPPDATA%\Docker\wsl\data\ext4.vhdx']
name = { tr = "Docker sanal diski", en = "Docker virtual disk" }
about = { tr = "Docker imajlarını ve konteynerlerini tutan sanal disk. İçi boşalsa bile kendiliğinden küçülmez.", en = "The virtual disk holding Docker images and containers. It does not shrink by itself." }
effect = { tr = "Bu dosyayı asla doğrudan silmeyin, tüm Docker verileri kaybolur.", en = "Never delete this file directly; all Docker data would be lost." }
manual = { tr = "\"docker system prune -a\" ile kullanılmayan imajları silin, sonra Docker Desktop > Troubleshoot > \"Clean / Purge data\" ile diski küçültün.", en = "Remove unused images with \"docker system prune -a\", then shrink the disk in Docker Desktop > Troubleshoot > \"Clean / Purge data\"." }
