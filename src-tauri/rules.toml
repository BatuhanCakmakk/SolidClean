id = "huggingface-cache"
safety = "review"
category = "ai"
kind = "dir"
paths = ['%USERPROFILE%\.cache\huggingface']
name = { tr = "Hugging Face modelleri", en = "Hugging Face models" }
about = { tr = "Python yapay zekâ kütüphanelerinin indirdiği modeller ve veri setleri.", en = "Models and datasets downloaded by Python AI libraries." }
effect = { tr = "Silinen modeller tekrar kullanılırsa yeniden indirilir.", en = "Removed models are downloaded again if used later." }
manual = { tr = "Terminalde \"huggingface-cli delete-cache\" ile hangi modellerin silineceğini seçin.", en = "Run \"huggingface-cli delete-cache\" in a terminal and choose what to remove." }

[[rule]]
id = "claude-temp"
