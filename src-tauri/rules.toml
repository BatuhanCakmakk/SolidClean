# ---------------------------------------------------------------- gözden geçir

[[rule]]
id = "recycle-bin"
safety = "review"
category = "cache"
kind = "recycle_bin"
name = { tr = "Geri Dönüşüm Kutusu", en = "Recycle Bin" }
about = { tr = "Sildiğiniz ama henüz kalıcı olarak kaldırılmamış dosyalar.", en = "Files you deleted that have not been removed permanently yet." }
effect = { tr = "Bu dosyalar geri getirilemez. Boşaltmadan önce içine göz atın.", en = "These files can no longer be restored. Look inside before emptying it." }

[[rule]]
id = "old-downloads"
safety = "review"
category = "archive"
kind = "files"
paths = ['%USERPROFILE%\Downloads']
extensions = ["exe", "msi", "msix", "iso", "zip", "7z", "rar"]
older_than_days = 30
name = { tr = "Eski kurulum dosyaları ve arşivler", en = "Old installers and archives" }
about = { tr = "İndirilenler klasöründe 30 günden eski kurulum dosyaları ve sıkıştırılmış arşivler.", en = "Installers and compressed archives in Downloads that are older than 30 days." }
effect = { tr = "Program zaten kuruluysa bir etkisi yok. Arşivlerin içinde ihtiyacınız olan bir şey olmadığından emin olun.", en = "No effect if the program is already installed. Make sure no archive holds something you need." }

[[rule]]
id = "hibernation"
safety = "review"
category = "system"
kind = "file"
paths = ['%SystemDrive%\hiberfil.sys']
admin = true
command = "powercfg /hibernate off"
name = { tr = "Hazırda bekletme dosyası", en = "Hibernation file" }
about = { tr = "Hazırda bekletme ve Hızlı Başlangıç için belleğin diske yazıldığı dosya.", en = "Where memory is saved for hibernation and Fast Startup." }
effect = { tr = "Hazırda bekletme ve Hızlı Başlangıç kapanır, açılış birkaç saniye uzayabilir. Geri açmak için: powercfg /hibernate on", en = "Hibernation and Fast Startup are turned off; startup may take a few seconds longer. To undo: powercfg /hibernate on" }

[[rule]]
id = "windows-old"
safety = "review"
category = "system"
kind = "dir"
paths = ['%SystemDrive%\Windows.old']
admin = true
name = { tr = "Önceki Windows kurulumu", en = "Previous Windows installation" }
about = { tr = "Büyük bir Windows güncellemesinden sonra kalan eski sistem. 10 gün sonra kendiliğinden silinir.", en = "The old system left after a major Windows update. Windows removes it after 10 days." }
effect = { tr = "Önceki Windows sürümüne geri dönemezsiniz.", en = "You can no longer go back to the previous Windows version." }
manual = { tr = "Ayarlar > Sistem > Depolama > Geçici dosyalar > \"Önceki Windows yüklemeleri\" seçeneğini işaretleyip kaldırın.", en = "Settings > System > Storage > Temporary files > select \"Previous Windows installation(s)\" and remove." }

# ---------------------------------------------------------------- yapay zekâ araçları
# Bu araçların dosyaları açık oturumlar, sohbet geçmişi ve modeller içerir. Kurallar:
# - her zaman "review" (testlerle zorunlu); genel kurallar (ör. user-temp) bu klasörlere dokunmaz
# - silinen her şey Geri Dönüşüm Kutusu'na gider (kalıcı silme seçilse bile)
# - silinebilenler en az 30 gündür kullanılmamış olmalı; araç açıkken temizlenmez
# - sohbet geçmişi ve modeller hiç silinmez: aracın kendi silme komutu gösterilir (manual)

[[rule]]
id = "ollama-models"
safety = "review"
category = "ai"
kind = "dir"
paths = ['%USERPROFILE%\.ollama\models']
name = { tr = "Ollama modelleri", en = "Ollama models" }
about = { tr = "Bilgisayarınızda çalışan yapay zekâ modelleri. Her biri birkaç GB olabilir.", en = "AI models that run on your computer. Each can be several GB." }
effect = { tr = "Silinen model tekrar kullanılmak istenirse yeniden indirilir.", en = "A removed model is downloaded again if you use it later." }
manual = { tr = "Terminalde \"ollama list\" ile modelleri görün, kullanmadıklarınızı \"ollama rm <model>\" ile kaldırın.", en = "Run \"ollama list\" in a terminal, then remove unused ones with \"ollama rm <model>\"." }

