# Temizlik kuralları. Her kural neyin, neden ve nasıl temizlenebileceğini tanımlar.
# Uygulama bu dosyayı derleme sırasında içine gömer.
#
# kind:
#   contents     klasörün İÇİNDEKİLER silinir, klasörün kendisi kalır
#   files        klasördeki, uzantısı ve yaşı tutan dosyalar silinir (alt klasörlere inilmez)
#   file         tek dosya
#   dir          yalnızca ölçülür; temizlik elle yapılır (manual zorunlu)
#   recycle_bin  Geri Dönüşüm Kutusu
# safety:        safe (güvenle silinebilir) | review (önce gözden geçirilmeli)
# paths:         %ORTAM_DEĞİŞKENİ% ve klasör adında * desteklenir
# command:       varsa silme yerine çalıştırılır. command_check verilmişse ve o komut
#                bilgisayarda yoksa normal temizliğe dönülür; verilmemişse yalnızca komut çalışır.
# older_than_days: contents/files için yaş sınırı; klasörlerde içindeki en yeni dosyaya bakılır
# exclude:       contents kurallarında dokunulmayan alt öğe adları
# close_apps:    açıkken temizlenemeyen programlar (.exe olmadan); "Gradle daemon" özel addır
# wait_for_restart: bir güncelleme yeniden başlatma bekliyorsa temizlenmez
# review_if_recent_days: hedefte bu kadar günden yeni değişiklik varsa öneri "review" olur
# services:      temizlikten önce durdurulup sonra başlatılan Windows hizmetleri
#
# Silme hedefleri ayrıca safety.rs'deki koruma listesinden geçer; bu dosyada bir hata
# olsa bile Windows, Program Files veya kişisel klasörler silinemez.

# ---------------------------------------------------------------- güvenli

[[rule]]
id = "user-temp"
safety = "safe"
category = "cache"
kind = "contents"
paths = ['%TEMP%']
# Windows'un Disk Temizleme'si de 7 günden yeni geçici dosyalara dokunmaz
# (VolumeCaches\Temporary Files: LastAccess = 7).
older_than_days = 7
# Yapay zekâ araçlarının klasörleri; kendi "gözden geçirin" kuralları var (claude-temp, gemini-temp).
exclude = ['claude', 'gemini']
regenerates = true
name = { tr = "Geçici dosyalar", en = "Temporary files" }
about = { tr = "Programların kurulum ve çalışma sırasında bıraktığı geçici dosyalar.", en = "Leftovers that programs create while installing or running." }
effect = { tr = "Bir etkisi yok. Son 7 günde kullanılan ve şu an açık olan dosyalar atlanır.", en = "No effect. Files used in the last 7 days and files in use are skipped." }

[[rule]]
id = "windows-temp"
safety = "safe"
category = "cache"
kind = "contents"
paths = ['%SystemRoot%\Temp']
older_than_days = 7
admin = true
regenerates = true
name = { tr = "Windows geçici dosyaları", en = "Windows temporary files" }
about = { tr = "Windows'un ve hizmetlerin kullandığı sistem geneli geçici klasör.", en = "The system-wide temporary folder used by Windows and its services." }
effect = { tr = "Bir etkisi yok. Son 7 günde kullanılan ve şu an açık olan dosyalar atlanır.", en = "No effect. Files used in the last 7 days and files in use are skipped." }

[[rule]]
id = "update-cache"
safety = "safe"
category = "cache"
kind = "contents"
paths = ['%SystemRoot%\SoftwareDistribution\Download']
admin = true
services = ["wuauserv", "bits"]
# Kurulumu yeniden başlatmayı bekleyen bir güncellemenin dosyaları silinmesin.
wait_for_restart = true
regenerates = true
name = { tr = "Windows Update indirmeleri", en = "Windows Update downloads" }
about = { tr = "Kurulmuş güncellemelerin indirilen kurulum dosyaları.", en = "Downloaded setup files of updates that are already installed." }
effect = { tr = "Bir etkisi yok. Yeniden başlatma bekleyen bir güncelleme varsa temizlenmez; Windows bir sonraki güncellemede gerekenleri yeniden indirir.", en = "No effect. Skipped while an update is waiting for a restart; Windows downloads what it needs again at the next update." }

[[rule]]
id = "delivery-optimization"
safety = "safe"
category = "cache"
kind = "contents"
paths = ['%SystemRoot%\ServiceProfiles\NetworkService\AppData\Local\Microsoft\Windows\DeliveryOptimization\Cache']
admin = true
command = "Delete-DeliveryOptimizationCache -Force"
command_check = "Delete-DeliveryOptimizationCache"
regenerates = true
name = { tr = "Teslim İyileştirme önbelleği", en = "Delivery Optimization cache" }
about = { tr = "Windows'un güncellemeleri ağdaki diğer bilgisayarlarla paylaşmak için tuttuğu kopyalar.", en = "Copies Windows keeps to share updates with other PCs on your network." }
effect = { tr = "Bir etkisi yok.", en = "No effect." }

[[rule]]
id = "error-reports"
safety = "safe"
category = "cache"
kind = "contents"
paths = [
  '%LOCALAPPDATA%\CrashDumps',
  '%LOCALAPPDATA%\Microsoft\Windows\WER\ReportArchive',
  '%LOCALAPPDATA%\Microsoft\Windows\WER\ReportQueue',
]
name = { tr = "Çökme dökümleri ve hata raporları", en = "Crash dumps and error reports" }
about = { tr = "Programlar çöktüğünde oluşturulan bellek dökümleri ve gönderilmiş hata raporları.", en = "Memory dumps created when programs crash, and error reports already sent." }
effect = { tr = "Geliştiriciye çökme raporu göndermeyecekseniz bir etkisi yok.", en = "No effect unless you plan to send a crash report to a developer." }

[[rule]]
id = "system-error-reports"
safety = "safe"
category = "cache"
kind = "contents"
paths = [
  '%ProgramData%\Microsoft\Windows\WER\ReportArchive',
  '%ProgramData%\Microsoft\Windows\WER\ReportQueue',
]
admin = true
name = { tr = "Sistem hata raporları", en = "System error reports" }
about = { tr = "Windows'un ve programların sistem genelinde tuttuğu, gönderilmiş ya da sırada bekleyen hata raporları.", en = "System-wide error reports from Windows and programs, already sent or waiting in the queue." }
effect = { tr = "Bir etkisi yok.", en = "No effect." }

# Mavi ekran dökümleri sorunun nedenini bulmak için gerekir: son 30 gündeyse "gözden geçir"e düşer.

[[rule]]
id = "minidumps"
safety = "safe"
category = "cache"
kind = "contents"
paths = ['%SystemRoot%\Minidump']
admin = true
review_if_recent_days = 30
name = { tr = "Mavi ekran küçük dökümleri", en = "Blue screen minidumps" }
about = { tr = "Her mavi ekranda kaydedilen küçük dökümler. Sorunun nedenini bulmak için kullanılır.", en = "Small dumps saved at every blue screen. Used to find out what caused it." }
effect = { tr = "Son 30 günde mavi ekran olduysa ve nedenini araştırıyorsanız silmeyin; değilse bir etkisi yok.", en = "If you had a blue screen in the last 30 days and are looking into it, keep them; otherwise no effect." }

[[rule]]
id = "memory-dump"
safety = "safe"
category = "cache"
kind = "file"
paths = ['%SystemRoot%\MEMORY.DMP']
admin = true
review_if_recent_days = 30
name = { tr = "Tam bellek dökümü", en = "Full memory dump" }
about = { tr = "Son mavi ekranda belleğin tamamının kaydedildiği dosya. Genellikle çok büyüktür.", en = "The full memory snapshot from the last blue screen. Usually very large." }
effect = { tr = "Son 30 günde mavi ekran olduysa ve nedenini araştırıyorsanız silmeyin; değilse bir etkisi yok.", en = "If you had a blue screen in the last 30 days and are looking into it, keep it; otherwise no effect." }

