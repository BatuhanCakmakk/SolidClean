[package]
name = "solidclean"
version = "0.1.0"
description = "Disk alanı analiz ve temizlik aracı"
license = "GPL-3.0-or-later"
edition = "2021"
default-run = "solidclean"

[lib]
name = "solidclean_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }
toml = "1.1.8"

[profile.release]
lto = true
codegen-units = 1
strip = true
