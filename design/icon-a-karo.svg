    <linearGradient id="t3" x1="0" y1="0" x2=".6" y2="1"><stop offset="0" stop-color="#38CDB0"/><stop offset="1" stop-color="#1AAE94"/></linearGradient>
    <linearGradient id="t4" x1="0" y1="0" x2=".6" y2="1"><stop offset="0" stop-color="#CBF1EA"/><stop offset="1" stop-color="#93DCCF"/></linearGradient>
